[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "claude-launcher"
version = "0.3.0"
description = "cm: start Claude Code with exactly the MCP servers, claude.ai connectors, plugins and cmux computer-use you pick"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "textual>=8.0,<9",  # Select.NULL (8.0+); tui.FlowRadioSet uses RadioSet._selected
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/vams-mx/claude-launcher"
Issues = "https://github.com/vams-mx/claude-launcher/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cm = "claude_launcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
